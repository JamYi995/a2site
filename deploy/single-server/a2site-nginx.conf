# Include this file inside the jamboxsys.com HTTPS server block, before the
# generic /api/ and /.well-known/ locations.

location = /.well-known/a2site.json {
    proxy_pass http://127.0.0.1:3320;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location = /.well-known/agent-site.json {
    proxy_pass http://127.0.0.1:3320;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /api/a2site/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3320;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}
